services:
  - type: web
    runtime: static
    name: miami-dental-clinic
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_SITE_URL
        sync: false # set in the dashboard, e.g. https://miami-dental-clinic.onrender.com
      - key: VITE_FORM_ENDPOINT
        sync: false # e.g. a Formspree form URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
